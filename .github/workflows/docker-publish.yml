name: Publish Docker image

# Builds the Fisherboy image and pushes it to GitHub Container Registry (GHCR)
# on every push to main and on every tagged release. EasyPanel / Docker can then
# pull ghcr.io/<owner>/fisherboy:latest without building from source.

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Rebuild semanal (lunes 05:00 UTC) aunque nadie toque el código: la imagen trae yt-dlp del
  # canal nightly, y YouTube rompe la extracción cada pocas semanas. Sin este cron, la imagen
  # se queda con el yt-dlp del día que se buildeó y las descargas vuelven a fallar solas.
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Invalida SOLO la capa de yt-dlp en cada build (el resto del cache se conserva).
          # Sin esto, el cache de GHA reusaría el `pip install --pre yt-dlp` para siempre y la
          # imagen quedaría clavada en el yt-dlp del primer build — justo lo contrario de lo
          # que se busca con el canal nightly. github.run_id cambia en cada corrida.
          build-args: |
            YTDLP_REFRESH=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
