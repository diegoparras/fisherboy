name: Publish Docker image

# Builds the Fisherboy image and pushes it to GitHub Container Registry (GHCR)
# on every push to main and on every tagged release. EasyPanel / Docker can then
# pull ghcr.io/<owner>/fisherboy:latest without building from source.
#
# Cada version dice que cambia, desde una sola fuente: la seccion "## [X.Y.Z]" del CHANGELOG.md
# (X.Y.Z = app/__init__.__version__). Sin esa seccion el build no sale. En main, la imagen se
# etiqueta tambien :X.Y.Z (+ label OCI version) y un push crea el Release vX.Y.Z con las notas.

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Rebuild semanal (lunes 05:00 UTC) aunque nadie toque el código: la imagen trae yt-dlp del
  # canal nightly, y YouTube rompe la extracción cada pocas semanas. Sin este cron, la imagen
  # se queda con el yt-dlp del día que se buildeó y las descargas vuelven a fallar solas.
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # crear el tag y el Release de la version
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Solo stdlib: corre con el python3 del runner, sin instalar dependencias.
      - name: Version y novedades (CHANGELOG)
        id: ver
        run: |
          V="$(python3 -m app.novedades --version)"
          python3 -m app.novedades > "$RUNNER_TEMP/notas.md"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          {
            echo "## Fisherboy v$V"
            echo
            cat "$RUNNER_TEMP/notas.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.version }},enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Invalida SOLO la capa de yt-dlp en cada build (el resto del cache se conserva).
          # Sin esto, el cache de GHA reusaría el `pip install --pre yt-dlp` para siempre y la
          # imagen quedaría clavada en el yt-dlp del primer build — justo lo contrario de lo
          # que se busca con el canal nightly. github.run_id cambia en cada corrida.
          build-args: |
            YTDLP_REFRESH=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Solo en un push a main: el rebuild semanal (cron) y el manual rehacen la misma version
      # a proposito (yt-dlp nightly) y no tienen que avisar ni crear nada.
      - name: Release de la version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "::warning::La v$V ya estaba publicada: este deploy no subio la version (patch) ni sumo novedades."
          else
            gh release create "v$V" --target "$GITHUB_SHA" --title "Fisherboy v$V" --notes-file "$RUNNER_TEMP/notas.md"
          fi
