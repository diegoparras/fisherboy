# Actualizaciones automáticas — pero revisadas.
#
# El pin por digest del sidecar bgutil (docker-compose*.yml) lo hace inmutable: nadie puede
# cambiar lo que hay detrás de ese hash. El precio de un pin es quedarse viejo, y en este stack
# quedarse quieto es exactamente lo que rompe (YouTube cambia, el provider se actualiza detrás).
# Dependabot paga ese precio: cuando sale una versión nueva abre un PR con el digest nuevo, y
# vos decidís. Al día, sin pullear a ciegas.
#
# Ojo con lo que Dependabot NO cubre acá, a propósito: yt-dlp se instala sin pin desde el
# Dockerfile (canal nightly) y se refresca con el rebuild semanal del workflow. Eso es
# deliberado — un yt-dlp viejo es un descargador roto, y ahí la frescura vale más que el
# control de cambios.
version: 2
updates:
  # Las imágenes de los compose: el sidecar bgutil (digest) y Redis.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "docker"]

  # La imagen base del Dockerfile (python:3.12-slim).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "docker"]

  # Las actions del workflow que publica la imagen.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    labels: ["dependencies", "ci"]
