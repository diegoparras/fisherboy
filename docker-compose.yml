# Fisherboy v1 — núcleo liviano. API + worker + Redis.
# Postgres y observabilidad (Prometheus/Loki/Grafana) entran en v3.
#
# La red `escriba_internal` es externa: Fisherboy se enchufa a la constelación
# existente para alcanzar a Anonimal y a Escriba por red interna (regla del pulpo,
# ADR-001). Si todavía no existe, creala con:
#   docker network create escriba_internal

services:
  fisherboy-api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"   # exponé solo en standalone; en sidekick dejalo detrás de la red
    depends_on: [fisherboy-redis]
    networks: [fisherboy, escriba_internal, pot]
    restart: unless-stopped

  fisherboy-worker:
    build: .
    command: python -m app.worker
    env_file: .env
    depends_on: [fisherboy-redis]
    networks: [fisherboy, escriba_internal, pot]
    restart: unless-stopped

  fisherboy-redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    networks: [fisherboy]
    restart: unless-stopped

  # PO Token provider (bgutil) — el que hace que YouTube entregue los formatos.
  # YouTube (SABR) exige un proof-of-origin token: corre BotGuard en el navegador y manda el
  # token con cada pedido. Sin él la lista de formatos viene vacía y yt-dlp corta con
  # "Requested format is not available" (el audio/mp3 es lo primero que desaparece). Este
  # sidecar corre esa misma VM de BotGuard en Node y fabrica tokens a pedido; el plugin de
  # yt-dlp (instalado en la imagen) se los pide solo por HTTP. Sin estado, no expone puerto
  # al host: solo lo alcanzan la API y el worker por la red interna.
  # NO arregla el bloqueo por IP ("Sign in to confirm you're not a bot"): para eso, cookies
  # de sesión + proxy residencial (Avanzado en la UI, o YT_COOKIES/YT_PROXY).
  # Fijado por DIGEST, no por `latest`. No es desconfianza del proyecto (es el provider que
  # recomienda la wiki de yt-dlp, GPL-3, activo): es que este contenedor VE TUS CREDENCIALES DE
  # PROXY —el plugin le manda el `proxy` en cada pedido, para que el token se genere desde tu
  # misma IP— y con `latest` + auto-deploy, un compromiso de la cuenta upstream entraría solo en
  # el próximo redeploy. Un digest es inmutable: nadie puede cambiar lo que hay detrás del hash.
  # Y para no quedar clavado en una versión vieja (que es la OTRA forma de romperse), Dependabot
  # abre un PR cuando sale una nueva — ver .github/dependabot.yml. Al día, pero revisado.
  #
  # Red propia (`pot`): habla con la API y el worker, pero NO ve a Redis. Si algún día esa
  # imagen resulta hostil, no encuentra la cola ni los sobres del otro lado.
  fisherboy-bgutil:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1@sha256:1aaa43a0ca72dfca6a6d2129a0fb4a23465c25adb1b043f8aff829a20825646b
    networks: [pot]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]     # Node escucha en 4416 (>1024): no necesita ninguna capability
    restart: unless-stopped

  # Persistencia opcional (Capa 7). Activar con: docker compose --profile persist up
  # y seteando DATABASE_URL=postgresql://fisherboy:fisherboy@fisherboy-postgres:5432/fisherboy
  fisherboy-postgres:
    image: pgvector/pgvector:pg16
    profiles: [persist]
    environment:
      POSTGRES_USER: fisherboy
      POSTGRES_PASSWORD: fisherboy
      POSTGRES_DB: fisherboy
    volumes:
      - fisherboy_pgdata:/var/lib/postgresql/data
    networks: [fisherboy]
    restart: unless-stopped

volumes:
  fisherboy_pgdata:

networks:
  fisherboy:
  # Red dedicada al PO Token provider: solo la API y el worker cruzan a ella. Mantiene al
  # sidecar (código de terceros que ejecuta la VM de BotGuard de Google) lejos de Redis.
  pot:
  escriba_internal:
    external: true
