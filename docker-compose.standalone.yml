# Fisherboy STANDALONE — todo en uno, sin depender de Escriba/Anonimal.
# API (con UI propia) + worker + Redis. Ideal para self-host (EasyPanel, Docker Desktop).
#
#   1) cp .env.example .env   # y poné SECRET_KEY + GOD/ANGEL/HUMAN_PASSWORD
#   2) docker compose -f docker-compose.standalone.yml up -d --build
#   3) abrí http://localhost:8000
#
# Sin ANONIMAL_URL, el modo "opaco" usa el anonimizador regex incorporado (email/CUIT/
# IP/tarjeta/teléfono). Para el NER completo, seteá ANONIMAL_URL hacia una instancia de
# Anonimal (vive dentro de Escriba).

services:
  fisherboy-api:
    build: .
    image: ghcr.io/diegoparras/fisherboy:latest
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      APP_MODE: standalone
      REDIS_URL: redis://fisherboy-redis:6379/0
    env_file: .env
    ports:
      - "8000:8000"
    # Para bajar videos de YouTube desde el server (IP de datacenter), yt-dlp necesita
    # cookies de una sesión logueada. Exportá un cookies.txt (formato Netscape), descomentá
    # el volumen y poné YT_COOKIES=/app/cookies.txt en .env. Usá una cuenta SECUNDARIA.
    # (Alternativa: cargá las cookies por job en el panel Avanzado de la UI, sin tocar esto.)
    # volumes:
    #   - ./cookies.txt:/app/cookies.txt:ro
    depends_on: [fisherboy-redis]
    networks: [fisherboy, pot]
    restart: unless-stopped

  fisherboy-worker:
    build: .
    image: ghcr.io/diegoparras/fisherboy:latest
    command: python -m app.worker
    environment:
      APP_MODE: standalone
      REDIS_URL: redis://fisherboy-redis:6379/0
    env_file: .env
    depends_on: [fisherboy-redis]
    networks: [fisherboy, pot]
    restart: unless-stopped

  # Redis CON persistencia a disco. No es por la cola (un job perdido se reencola), sino por
  # las SESIONES DE BROWSER: si Redis arranca vacío, el login que hiciste a mano en la ventana
  # se perdió y hay que rehacerlo. Ojo: esto implica que las cookies de tus sesiones quedan
  # escritas en el disco del server — para uso personal está bien, pero dejan de ser efímeras.
  # appendonly (AOF) y no snapshots: pierde a lo sumo un segundo, y acá lo que importa es no
  # tener que loguearse de nuevo.
  fisherboy-redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - fisherboy_redisdata:/data
    networks: [fisherboy]
    restart: unless-stopped

  # PO Token provider (bgutil) — sin esto, YouTube no entrega los formatos.
  # YouTube (SABR) exige un proof-of-origin token que el navegador fabrica corriendo BotGuard.
  # Sin el token, la lista de formatos viene vacía y yt-dlp corta con "Requested format is not
  # available" — el audio (mp3) es lo primero que desaparece. Este sidecar corre esa misma VM
  # de BotGuard en Node y fabrica tokens a pedido; el plugin de yt-dlp que está en la imagen
  # se los pide solo (YT_POT_URL, por defecto http://fisherboy-bgutil:4416). Sin estado y sin
  # puerto al host. NO reemplaza a las cookies: si YouTube pide "Sign in to confirm you're not
  # a bot" es la IP la que está quemada → cookies + proxy residencial.
  # Fijado por DIGEST (inmutable), no por `latest`: este contenedor VE TUS CREDENCIALES DE PROXY
  # —el plugin se las manda para generar el token desde tu misma IP— así que un compromiso de la
  # cuenta upstream no puede entrar solo en un redeploy. Para no quedar clavado en una versión
  # vieja (la otra forma de romperse), Dependabot abre un PR cuando sale una nueva.
  # Red propia (`pot`): habla con la API y el worker, pero NO ve a Redis.
  fisherboy-bgutil:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.0@sha256:ed86b6fdd5e430ddd7c8ce1adb55e1ab54db7c7dbc1bcbf3a82454a85b971164
    networks: [pot]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

networks:
  fisherboy:
  # Red dedicada al provider: lo mantiene lejos de Redis (ejecuta código de terceros).
  pot:

volumes:
  fisherboy_redisdata:
