[project]
name = "fisherboy"
version = "1.14.1"
description = "Sistema supremo de scraping: adquiere la web, la convierte a markdown/JSON, la anonimiza y la entrega. Sidekick de Escriba o standalone."
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = ["browser: levanta un Chromium real (Playwright)"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Lo que agarra bugs (pyflakes, bugbear), imports ordenados y sintaxis moderna.
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",   # largo de línea: el código ya se mantiene ~100 a mano; no vale un diff de 160 líneas
    "E702",   # `a; b` en una línea: se usa a propósito en un par de tablas de casos
    "E731",   # lambda asignada: idem
    "E741",   # nombres como `l`: estilo
    "B904",   # `raise ... from`: se revisa caso por caso, no en masa
    "UP042",  # (str, Enum) -> StrEnum cambia str() de los valores: no es un cambio de estilo
]
